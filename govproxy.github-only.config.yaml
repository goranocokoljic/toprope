# GitHub-only config for initial testing.
# Copilot + Git enabled; Claude Code and Windsurf disabled so you can test
# with a single GitHub PAT and no Anthropic/Windsurf keys.
#
# Use it with:
#   npx govproxy doctor   -c govproxy.github-only.config.yaml
#   npx govproxy sync all -c govproxy.github-only.config.yaml
#   $env:GOVPROXY_CONFIG = "govproxy.github-only.config.yaml"; npm run dev

server:
  port: 8080
  host: "0.0.0.0"

storage:
  type: "sqlite"
  sqlite_path: "./data/govproxy.db"

connectors:
  copilot:
    enabled: true
    github_org: "your-org"          # <-- set your GitHub org login
    api_token: "${GITHUB_API_TOKEN}"
    sync_interval: "daily"
    sync_time: "02:00"

  claude_code:
    enabled: false

  windsurf:
    enabled: false

  git:
    enabled: true
    provider: "github"
    org: "your-org"                 # <-- set your GitHub org login
    api_token: "${GIT_API_TOKEN}"   # same PAT as copilot is fine
    repos:
      - "your-repo"                 # <-- at least one repo name (doctor fails on empty)
    sync_interval: "daily"
    sync_time: "03:00"
    analysis:
      churn_window_hours: 48
      ai_signature_enabled: true

expenses:
  import_path: "./data/expenses/"
  subscription_defaults:
    copilot_business: 19
    copilot_enterprise: 39
    cursor_pro: 20
    cursor_business: 40
    claude_code_pro: 20
    claude_code_max: 200
    windsurf_pro: 20
    windsurf_teams: 40

summaries:
  enabled: false

alerts:
  slack:
    enabled: false
  waste_threshold: 14

dashboard:
  enabled: true
  auth:
    type: "basic"
    admin_password: "${DASHBOARD_PASSWORD}"

teams:
  - name: "frontend"
    department: "engineering"
    manager: "goran"
  - name: "backend"
    department: "engineering"
    manager: "goran"
