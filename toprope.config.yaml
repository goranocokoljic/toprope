server:
  port: 8080
  host: "0.0.0.0"

storage:
  type: "sqlite"
  sqlite_path: "./data/toprope.db"

connectors:
  copilot:
    enabled: true
    github_org: "your-org"
    api_token: "${GITHUB_API_TOKEN}"
    sync_interval: "daily"
    sync_time: "02:00"

  claude_code:
    enabled: true
    org_id: "your-anthropic-org-id"
    api_key: "${ANTHROPIC_ADMIN_API_KEY}"
    sync_interval: "daily"
    sync_time: "02:30"

  windsurf:
    enabled: true
    service_key: "${WINDSURF_SERVICE_KEY}"
    sync_interval: "daily"
    sync_time: "03:00"

  cursor:
    enabled: true
    service_key: "${CURSOR_SERVICE_KEY}"
    sync_interval: "daily"
    sync_time: "03:15"

  git:
    enabled: true
    provider: "github"
    org: "your-org"
    api_token: "${GIT_API_TOKEN}"
    repos: []
    sync_interval: "daily"
    sync_time: "03:00"
    analysis:
      churn_window_hours: 48
      ai_signature_enabled: true

expenses:
  import_path: "./data/expenses/"
  subscription_defaults:
    copilot_business: 19
    copilot_enterprise: 39
    cursor_pro: 20
    cursor_business: 40
    claude_code_pro: 20
    claude_code_max: 200
    windsurf_pro: 20
    windsurf_teams: 40

aggregation:
  weekly:
    day: "monday"
    time: "04:00"
  monthly:
    day: 1
    time: "04:30"
  quarterly:
    time: "05:00"
  daily_retention_days: 90

summaries:
  enabled: false
  # Default to a LOCAL model (Ollama) for privacy — the model only ever receives
  # aggregate numbers, never code or commit contents, and keeping it local means
  # no data leaves the network. See docs/summaries-model.md for the default model
  # choice and infrastructure requirements.
  model:
    type: "ollama"
    endpoint: "http://localhost:11434"
    model_name: "llama3.1:70b"     # larger local model — quality for monthly+
    # api_key: "${SUMMARY_MODEL_API_KEY}"   # only needed for anthropic/openai
  weekly:
    enabled: true
    auto_generate: true
    model_name: "llama3.1:8b"      # small/fast local model for frequent weekly output
  monthly:
    enabled: true
    auto_generate: true
  quarterly:
    enabled: true
    auto_generate: false
  yearly:
    enabled: true
    auto_generate: false

alerts:
  slack:
    enabled: false
    webhook_url: "${SLACK_WEBHOOK_URL}"
  waste_threshold: 14

# Slack self-reporting bot (Task 4.2). Distinct from alerts.slack (a one-way
# webhook for waste alerts): this is a full bot with the /toprope-log slash
# command and an interactive logging form. Developers must be linked to their
# Slack user id (`toprope dev link --id <dev-id> --slack <U…>`) before they can
# log. See docs/slack-bot.md for the Slack app setup.
slack:
  enabled: false
  bot_token: "${SLACK_BOT_TOKEN}"          # xoxb-… bot user OAuth token
  signing_secret: "${SLACK_SIGNING_SECRET}" # verifies every inbound request
  daily_prompt:
    enabled: false        # opt-in, dismissible end-of-day nudge
    time: "16:00"         # HH:MM UTC
    channels: []          # Slack channel ids (e.g. ["C0123ABCD"]) to post into

dashboard:
  enabled: true
  auth:
    type: "basic"
    admin_password: "${DASHBOARD_PASSWORD}"

teams:
  - name: "frontend"
    department: "engineering"
    manager: "goran"
  - name: "backend"
    department: "engineering"
    manager: "goran"
